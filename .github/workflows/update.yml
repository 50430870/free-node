name: Auto Update Nodes

# 触发条件：每天按计划执行，或者支持手动点击执行
on:
  schedule:
    - cron: '0 */4 * * *' # 每 4 小时自动触发一次
  workflow_dispatch:      # 允许你在网页端手动点击运行

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 安装极速 Bun 环境
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 3. 安装项目依赖
        run: bun install

      - name: 4. 执行节点抓取逻辑
        run: bun run begin # 对应 package.json 中的命令

      - name: 5. 将生成的订阅文件打包推送到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # 如果没有抓到新数据，跳过提交，避免报错
          git commit -m "chore: 自动更新优化节点 [skip ci]" || echo "No changes to commit"
          git push
